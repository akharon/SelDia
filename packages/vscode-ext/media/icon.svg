<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');

      .bg-cream { fill: #f5f1e8; }
      .border-blue { stroke: #5b7fa6; stroke-width: 7; fill: none; }
      .bg-light { fill: #faf9f7; }
      .text-dark { fill: #2c3e50; font-family: 'JetBrains Mono', monospace; }
      .text-bold { font-weight: 600; }
      .stroke-dark { stroke: #2c3e50; fill: none; stroke-width: 2; }
      .color-warm { fill: #d4a574; }
      .color-teal { fill: #5b9fa3; }
      .color-accent { fill: #c8d9e6; }
      .hatching { stroke: #2c3e50; stroke-width: 0.8; opacity: 0.25; }
    </style>
  </defs>

  <!-- Outer rounded rectangle background -->
  <rect width="512" height="512" rx="60" ry="60" class="bg-cream"/>
  <rect width="512" height="512" rx="60" ry="60" class="border-blue"/>

  <!-- Window/Browser Chrome -->
  <g id="window">
    <!-- Title bar background -->
    <rect x="65" y="75" width="382" height="45" rx="6" fill="#d9d3c8" stroke="#5b7fa6" stroke-width="2"/>

    <!-- Window control buttons (traffic lights) -->
    <circle cx="95" cy="97" r="5.5" fill="#e74c3c"/>
    <circle cx="120" cy="97" r="5.5" fill="#f39c12"/>
    <circle cx="145" cy="97" r="5.5" fill="#27ae60"/>

    <!-- Main content area -->
    <rect x="65" y="120" width="382" height="285" rx="6" fill="#faf9f7" stroke="#5b7fa6" stroke-width="2"/>
  </g>

  <!-- Left icon: Pen/Pencil (sketchy style) -->
  <g id="pen-icon">
    <!-- Pencil body -->
    <line x1="115" y1="155" x2="105" y2="185" class="stroke-dark" stroke-linecap="round"/>
    <line x1="117" y1="153" x2="107" y2="183" class="stroke-dark" stroke-linecap="round" opacity="0.6"/>
    <!-- Pencil tip -->
    <polygon points="103,185 108,195 113,187" class="color-warm"/>
  </g>

  <!-- Right icon: Speech bubble (sketchy style) -->
  <g id="speech-bubble">
    <!-- Bubble outline -->
    <path d="M 355 130 L 405 130 Q 415 130 415 140 L 415 170 Q 415 180 405 180 L 370 180 L 360 190 L 375 180 L 405 180 Q 415 180 415 170 L 415 140 Q 415 130 405 130"
          class="stroke-dark" fill="none"/>
    <!-- Sketchy second line -->
    <path d="M 356 131 L 404 131 Q 414 131 414 141 L 414 169 Q 414 179 404 179"
          class="stroke-dark" fill="none" opacity="0.4" stroke-width="1"/>
    <!-- Text lines inside -->
    <line x1="365" y1="145" x2="400" y2="145" class="hatching"/>
    <line x1="365" y1="160" x2="395" y2="160" class="hatching"/>
  </g>

  <!-- Center: "SelDia" text -->
  <g id="title">
    <text x="256" y="235" font-size="64" font-weight="600" text-anchor="middle" class="text-dark" letter-spacing="1">SelDia</text>
    <!-- Sketchy underline effect -->
    <line x1="190" y1="250" x2="322" y2="250" class="hatching" stroke-width="1.5"/>
    <line x1="192" y1="252" x2="320" y2="252" class="hatching" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Bottom: Diagram flow -->
  <g id="diagram">
    <!-- Left box: Source/Input -->
    <rect x="85" y="310" width="70" height="50" rx="3" class="color-warm" stroke="#2c3e50" stroke-width="2"/>
    <text x="120" y="340" font-size="11" text-anchor="middle" class="text-dark" font-weight="500">Input</text>

    <!-- Sketchy box effect -->
    <rect x="85" y="310" width="70" height="50" rx="3" fill="none" stroke="#2c3e50" stroke-width="1" opacity="0.3" transform="translate(1, 1)"/>

    <!-- Arrow: Input → Semantic -->
    <line x1="160" y1="335" x2="190" y2="335" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
    <polygon points="190,335 180,330 183,335 180,340" fill="#2c3e50"/>

    <!-- Middle box: Semantic -->
    <rect x="195" y="310" width="75" height="50" rx="3" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
    <text x="232" y="340" font-size="11" text-anchor="middle" class="text-dark" font-weight="500">Semantic</text>
    <rect x="195" y="310" width="75" height="50" rx="3" fill="none" stroke="#2c3e50" stroke-width="1" opacity="0.3" transform="translate(1, 1)"/>

    <!-- Arrow: Semantic → Architecture -->
    <line x1="275" y1="335" x2="305" y2="335" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
    <polygon points="305,335 295,330 298,335 295,340" fill="#2c3e50"/>

    <!-- Right box: Architecture -->
    <rect x="310" y="310" width="75" height="50" rx="3" class="color-accent" stroke="#2c3e50" stroke-width="2"/>
    <text x="347" y="340" font-size="11" text-anchor="middle" class="text-dark" font-weight="500">Architecture</text>
    <rect x="310" y="310" width="75" height="50" rx="3" fill="none" stroke="#2c3e50" stroke-width="1" opacity="0.3" transform="translate(1, 1)"/>

    <!-- Bottom center: Data storage oval -->
    <ellipse cx="256" cy="405" rx="55" ry="28" class="color-teal" stroke="#2c3e50" stroke-width="2"/>
    <!-- Sketchy oval effect -->
    <ellipse cx="256" cy="405" rx="55" ry="28" fill="none" stroke="#2c3e50" stroke-width="1" opacity="0.3" transform="translate(0.5, 0.5)"/>

    <!-- Curved connections (dashed) -->
    <!-- Input to Storage -->
    <path d="M 120 365 Q 180 385 210 425" stroke="#2c3e50" stroke-width="1.5" fill="none" stroke-dasharray="3,3" opacity="0.7"/>
    <!-- Semantic to Storage -->
    <path d="M 232 365 Q 256 385 256 377" stroke="#2c3e50" stroke-width="1.5" fill="none" stroke-dasharray="3,3" opacity="0.7"/>
    <!-- Architecture to Storage -->
    <path d="M 345 365 Q 300 385 300 425" stroke="#2c3e50" stroke-width="1.5" fill="none" stroke-dasharray="3,3" opacity="0.7"/>
  </g>

  <!-- Tagline text -->
  <g id="tagline">
    <text x="256" y="475" font-size="13" text-anchor="middle" class="text-dark" font-weight="500" letter-spacing="0.5">
      Semantic Language for Diagram Architecture
    </text>
    <!-- Sketchy line under tagline -->
    <line x1="140" y1="485" x2="372" y2="485" class="hatching" stroke-width="1"/>
  </g>

  <!-- Overall sketchy texture (very subtle) -->
  <filter id="roughTexture">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
