<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  
  <!-- Stylized "S" made of connected diagram nodes and edges -->
  
  <!-- Top pill (left side, horizontal rounded rectangle) -->
  <rect x="26" y="18" width="48" height="16" rx="8" fill="#ffffff" opacity="0.95"/>
  
  <!-- Edge: top pill ➔ diamond (down-right diagonally) -->
  <line x1="74" y1="27" x2="86" y2="54" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  <polygon points="84,51 89,58 81,57" fill="#ffffff" opacity="0.8"/>
  
  <!-- Center diamond (slightly larger) -->
  <polygon points="64,52 90,68 64,84 38,68" fill="#ffffff" opacity="0.92"/>
  
  <!-- Edge: diamond ➔ bottom pill (down-left diagonally) -->
  <line x1="42" y1="82" x2="30" y2="101" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  <polygon points="32,98 27,105 25,97" fill="#ffffff" opacity="0.8"/>
  
  <!-- Bottom pill (right side, horizontal rounded rectangle) -->
  <rect x="26" y="94" width="48" height="16" rx="8" fill="#ffffff" opacity="0.95"/>
</svg>
