<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  
  <!-- Stylized "S" made of diagram nodes and edges -->
  <!-- Top-left node -->
  <rect x="22" y="18" width="32" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
  <!-- Top-right node -->
  <rect x="74" y="18" width="32" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
  <!-- Center diamond -->
  <polygon points="64,52 82,66 64,80 46,66" fill="#ffffff" opacity="0.9"/>
  <!-- Bottom-left node -->
  <rect x="22" y="92" width="32" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
  <!-- Bottom-right node -->
  <rect x="74" y="92" width="32" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
  
  <!-- Connecting edges with arrowheads -->
  <!-- Top-left → Top-right -->
  <line x1="54" y1="27" x2="74" y2="27" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  <polygon points="71,23 80,27 71,31" fill="#ffffff" opacity="0.8"/>
  <!-- Top-right → Center -->
  <line x1="90" y1="36" x2="82" y2="52" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  <polygon points="84,49 80,57 77,50" fill="#ffffff" opacity="0.8"/>
  <!-- Center → Bottom-left -->
  <line x1="46" y1="66" x2="38" y2="92" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  <polygon points="40,89 36,97 34,89" fill="#ffffff" opacity="0.8"/>
  <!-- Bottom-left → Bottom-right -->
  <line x1="54" y1="101" x2="74" y2="101" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  <polygon points="71,97 80,101 71,105" fill="#ffffff" opacity="0.8"/>
</svg>
